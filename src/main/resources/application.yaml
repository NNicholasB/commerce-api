spring:
  application:
    name: commerce-api
  datasource:
    url: jdbc:postgresql://localhost:5432/commerce_db
    username: postgres
    password: postgres

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        format_sql: true
  rabbitmq:
    host: localhost
    port: 5672
    username: admin
    password: 123456
    logging:
      level:
        org.springframework.amqp.rabbit.core.RabbitAdmin: DEBUG
jwt:
  secret: ${JWT_SECRET}
  expiration: 3600000

